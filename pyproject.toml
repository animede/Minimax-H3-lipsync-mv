[project]
name = "minimax-h3-lipsync-mv"
version = "0.1.0"
description = "Generate a lip-synced music video from one character reference and one song using MiniMax-H3."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "librosa>=0.11,<1",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
